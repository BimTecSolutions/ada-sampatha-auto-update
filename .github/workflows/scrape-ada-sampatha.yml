name: Ada Sampatha — Incremental Update

on:
  schedule:
    # Offset by 4 minutes from the other two workflows (0/5 and 2/5) so
    # all three don't queue behind each other on shared runners.
    - cron: "4-59/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ada-sampatha-scraper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run scraper
        run: python main_ada_sampatha.py
        env:
          FIREBASE_CREDENTIALS: serviceAccountKey.json
          # START_DRAW_FALLBACK: "1"
          # MAX_CONSECUTIVE_MISSES: "3"
          # MAX_NEW_DRAWS_PER_RUN: "20"
          # DRAW_DELAY_SECONDS: "1.0"

      - name: Clean up credentials file
        if: always()
        run: rm -f serviceAccountKey.json
